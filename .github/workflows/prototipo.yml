name: Boceto en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["prototipo/**", ".github/workflows/prototipo.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    defaults:
      run:
        working-directory: prototipo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: prototipo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm presupuesto
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo/dist
      - id: despliegue
        uses: actions/deploy-pages@v4
